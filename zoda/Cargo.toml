[package]
name = "zoda-bench"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zoda-bench"
path = "src/main.rs"

[dependencies]
# leanVM backend for KoalaBear field types only
backend = { path = "../leanvm/crates/backend" }
blake3 = "1"
concrete-ntt = "0.2.0"
rayon = "1.11"
serde_json = "1.0"

[profile.release]
lto = "thin"
