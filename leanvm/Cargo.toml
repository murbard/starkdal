[package]
name = "starkdal-leanvm"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/lean_compiler",
    "crates/lean_prover",
    "crates/lean_vm",
    "crates/sub_protocols",
    "crates/utils",
    "crates/whir",
    "crates/xmss",
    "crates/rec_aggregation",
    "crates/backend",
    "crates/backend/utils",
    "crates/backend/field",
    "crates/backend/koala-bear",
    "crates/backend/poly",
    "crates/backend/symetric",
    "crates/backend/air",
    "crates/backend/fiat-shamir",
    "crates/backend/sumcheck",
    "crates/backend/system-info",
    "crates/backend/zk-alloc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.dead_code = "allow"
rustdoc.all = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
doc_markdown = "allow"
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
should_panic_without_expect = "allow"
similar_names = "allow"
suboptimal_flops = "allow"
cast_sign_loss = "allow"
wildcard_imports = "allow"

[workspace.dependencies]
utils = { path = "crates/utils" }
lean_vm = { path = "crates/lean_vm" }
sub_protocols = { path = "crates/sub_protocols" }
lean_compiler = { path = "crates/lean_compiler" }
lean_prover = { path = "crates/lean_prover" }
xmss = { path = "crates/xmss" }
rec_aggregation = { path = "crates/rec_aggregation" }
backend = { path = "crates/backend" }
zk-alloc = { path = "crates/backend/zk-alloc" }
system-info = { path = "crates/backend/system-info" }

sha3 = "0.11.0"
clap = { version = "4.5.59", features = ["derive"] }
rand = "0.10.0"
rayon = "1.11.0"
pest = "2.7"
pest_derive = "2.7"
itertools = "0.14.0"
tracing = "0.1.26"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
postcard = { version = "1.1.3", features = ["alloc"] }
lz4_flex = "0.13.0"

[dependencies]
utils.workspace = true
lean_vm.workspace = true
backend.workspace = true
lean_compiler.workspace = true
lean_prover.workspace = true
sub_protocols.workspace = true
serde_json.workspace = true
system-info.workspace = true
xmss.workspace = true
rec_aggregation.workspace = true
rayon.workspace = true

[features]
prox-gaps-conjecture = ["rec_aggregation/prox-gaps-conjecture"]
standard-alloc = ["rec_aggregation/standard-alloc"]

[profile.release]
lto = "thin"
