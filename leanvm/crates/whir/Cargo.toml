[package]
name = "mt-whir"
version.workspace = true
edition.workspace = true

[dependencies]
field = { path = "../backend/field", package = "mt-field" }
koala-bear = { path = "../backend/koala-bear", package = "mt-koala-bear" }
poly = { path = "../backend/poly", package = "mt-poly" }
sumcheck = { path = "../backend/sumcheck", package = "mt-sumcheck" }
fiat-shamir = { path = "../backend/fiat-shamir", package = "mt-fiat-shamir" }
utils = { path = "../backend/utils", package = "mt-utils" }
symetric = { path = "../backend/symetric", package = "mt-symetric" }
system-info.workspace = true

itertools.workspace = true
rayon.workspace = true
rand.workspace = true
tracing.workspace = true

gpu-merkle = { path = "../../../gpu/merkle", optional = true }
gpu-pow-grind = { path = "../../../gpu/pow_grind", optional = true }
gpu-ntt = { path = "../../../gpu/ntt", optional = true }
gpu-sumcheck = { path = "../../../gpu/sumcheck", optional = true }
gpu-poly-fold = { path = "../../../gpu/poly_fold", optional = true }
cudarc = { version = "0.16", features = ["cuda-12060"], optional = true }

[features]
gpu = ["dep:gpu-merkle", "dep:gpu-pow-grind", "dep:gpu-ntt", "dep:gpu-sumcheck", "dep:gpu-poly-fold", "dep:cudarc"]

[dev-dependencies]
tracing-forest.workspace = true
tracing-subscriber.workspace = true
